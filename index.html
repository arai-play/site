<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>arAi Play</title>
  <meta name="description" content="다양한 AI 웹앱과 게임을 발견하고 즐기며 의견을 나누는 작품 허브" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-route="home" role="button" tabindex="0" aria-label="arAi Play 홈으로 이동">
      <img src="arai-logo.png" alt="ARAI PLAY" class="brand-logo-image" />
    </div>

    <nav class="main-nav" aria-label="주요 메뉴">
      <button class="nav-btn active" data-route="home">홈</button>
      <button class="nav-btn" data-route="new">신규작</button>
      <button class="nav-btn" data-route="popular">인기작</button>
      <button class="nav-btn" data-route="ranking">랭킹</button>
      <button class="nav-btn" data-route="submit">작품 등록</button>
    </nav>
  </header>

  <main id="app" class="page-shell"></main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <dialog id="feedbackDialog" class="dialog">
    <div class="dialog-card dialog-card--mascot">
      <button class="dialog-close" type="button" id="feedbackClose" aria-label="닫기">×</button>
      <div class="feedback-mascot-wrap">
        <img src="arai-mascot.png" alt="아라 AI PLAY 대표 캐릭터" class="feedback-mascot" />
      </div>
      <h3>작품에 피드백 남기기</h3>
      <p class="feedback-guide">작품이 더 좋아질 수 있도록 따뜻하고 도움이 되는 의견을 남겨주세요 💜</p>
      <form class="dialog-form" id="feedbackForm">
        <input type="hidden" id="feedbackAppId" />
        <label>
          종류
          <select id="feedbackType" required>
            <option value="칭찬해요">💚 칭찬해요</option>
            <option value="궁금해요">❓ 궁금해요</option>
            <option value="제안해요">💡 제안해요</option>
          </select>
        </label>
        <label>
          닉네임
          <input id="feedbackNickname" maxlength="12" placeholder="예: 파란고래" required />
        </label>
        <label>
          내용
          <textarea id="feedbackText" maxlength="160" placeholder="친절하고 도움이 되는 말을 남겨주세요." required></textarea>
        </label>
        <button class="primary wide" type="submit">피드백 등록</button>
      </form>
    </div>
  </dialog>

  
  <dialog id="suggestionDialog" class="dialog">
    <div class="dialog-card dialog-card--mascot">
      <button class="dialog-close" type="button" id="suggestionClose" aria-label="닫기">×</button>
      <div class="feedback-mascot-wrap">
        <img src="arai-mascot.png" alt="arAi Play 대표 캐릭터" class="feedback-mascot" />
      </div>
      <h3>웹 건의하기</h3>
      <p class="feedback-guide">arAi Play을 더 즐겁고 편리하게 만들 아이디어를 들려주세요 💜</p>
      <form class="dialog-form" id="suggestionForm">
        <label>
          종류
          <select id="suggestionType" required>
            <option value="기능 제안">💡 기능 제안</option>
            <option value="불편한 점">🛠️ 불편한 점</option>
            <option value="오류 신고">🐞 오류 신고</option>
            <option value="기타">💬 기타</option>
          </select>
        </label>
        <label>
          닉네임 <span class="small">(선택)</span>
          <input id="suggestionNickname" maxlength="12" placeholder="비워두면 익명으로 표시돼요" />
        </label>
        <label>
          건의 내용
          <textarea id="suggestionText" maxlength="400" required
                    placeholder="어떤 점이 좋아지면 좋을지 구체적으로 적어주세요."></textarea>
        </label>
        <button class="primary wide" type="submit">건의사항 보내기</button>
      </form>
    </div>
  </dialog>


  <dialog id="adminLoginDialog" class="dialog">
    <div class="dialog-card">
      <button class="dialog-close" type="button" id="adminLoginClose" aria-label="닫기">×</button>
      <div class="google-login-icon" aria-hidden="true">G</div>
      <h3>교사 관리 로그인</h3>
      <p class="small">등록된 관리자 Google 계정으로 로그인해 주세요.</p>
      <button class="google-login-btn" type="button" id="googleAdminLogin">
        <span class="google-g">G</span>
        Google 계정으로 로그인
      </button>
      <p class="admin-account-hint">관리자 계정만 교사 관리 화면에 접근할 수 있습니다.</p>
    </div>
  </dialog>

  <dialog id="manageCodeDialog" class="dialog">
    <div class="dialog-card">
      <button class="dialog-close" type="button" id="manageCodeClose" aria-label="닫기">×</button>
      <div class="manage-icon" aria-hidden="true">🔑</div>
      <h3>작품 관리</h3>
      <p class="small">등록할 때 설정한 수정·삭제 코드를 입력하세요.</p>
      <form class="dialog-form" id="manageCodeForm">
        <input type="hidden" id="manageTargetId" />
        <label>
          수정·삭제 코드
          <input id="manageCodeInput" type="password" minlength="6" maxlength="20"
                 autocomplete="off" required placeholder="6~20자 코드" />
        </label>
        <div class="manage-choice">
          <button class="secondary" type="button" id="manageEditButton">✏️ 수정하기</button>
          <button class="danger" type="button" id="manageDeleteButton">🗑 삭제하기</button>
        </div>
      </form>
      <p class="code-security-note">코드를 아는 사람만 이 작품을 수정하거나 삭제할 수 있습니다.</p>
    </div>
  </dialog>

<footer class="site-footer">
    <div class="footer-inner">
      <p>건강한 AI 활용, 행복한 학교 생활을 응원합니다!</p>
      <div class="footer-actions">
        <button class="footer-suggestion-btn" id="footerSuggestionButton">💬 웹 건의하기</button>
        <button class="footer-board-btn" id="footerSuggestionBoardButton">📋 건의 게시판</button>
      </div>
      <button class="footer-admin-btn" id="footerAdminButton" aria-label="교사 관리" title="교사 관리">
        ⚙️
      </button>
    </div>
  </footer>


  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
