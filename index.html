<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아라 AI PLAY</title>
  <meta name="description" content="학생들이 AI로 만든 웹앱과 게임을 서로 공유하는 학교용 AI 작품 허브" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-route="home" role="button" tabindex="0">
      <div class="brand-mark">AI</div>
      <div>
        <h1>아라 AI PLAY</h1>
        <p>친구들이 AI와 함께 만든 작품 놀이터</p>
      </div>
    </div>

    <nav class="main-nav" aria-label="주요 메뉴">
      <button class="nav-btn active" data-route="home">홈</button>
      <button class="nav-btn" data-route="new">신규작</button>
      <button class="nav-btn" data-route="popular">인기작</button>
      <button class="nav-btn" data-route="ranking">랭킹</button>
      <button class="nav-btn" data-route="submit">작품 등록</button>
      <button class="nav-btn teacher" data-route="admin">교사 관리</button>
    </nav>
  </header>

  <main id="app" class="page-shell"></main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <dialog id="feedbackDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="feedbackForm">
      <button class="dialog-close" value="cancel" aria-label="닫기">×</button>
      <h3>친구에게 피드백 남기기</h3>
      <input type="hidden" id="feedbackAppId" />
      <label>
        종류
        <select id="feedbackType" required>
          <option value="칭찬해요">💚 칭찬해요</option>
          <option value="궁금해요">❓ 궁금해요</option>
          <option value="제안해요">💡 제안해요</option>
        </select>
      </label>
      <label>
        닉네임
        <input id="feedbackNickname" maxlength="12" placeholder="예: 파란고래" required />
      </label>
      <label>
        내용
        <textarea id="feedbackText" maxlength="160" placeholder="친절하고 도움이 되는 말을 남겨주세요." required></textarea>
      </label>
      <button class="primary wide" value="default" type="submit">피드백 등록</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
